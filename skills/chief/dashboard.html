<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chief Concert Hall</title>
<style>
/* Fonts ship with the skill (SIL OFL 1.1, see fonts/), so the page fetches nothing from outside this machine. */
@font-face { font-family: "Instrument Serif"; src: url("/fonts/instrument-serif.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("/fonts/instrument-sans.woff2") format("woff2"); font-weight: 400 700; font-stretch: 75% 100%; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url("/fonts/ibm-plex-mono.woff2") format("woff2"); font-display: swap; }
/* A concert hall at night. The stage shows who is playing now (one ensemble per live run, led by its chief), the
   programme lists every run as a compact slip, and a run opens as its score. Palette and robots are the README art's. */
:root {
  color-scheme: dark;
  --night: #140D08; --night-2: #1D130B;
  --gold: #E4B04A; --gold-lt: #F3D58F;
  --cream: #EFE4CF; --muted: #B3A285;
  --lamp: #FFC45E;
  --claude: #D4703C; --gpt: #74B9A7; --bad: #E0533D;
  --line: rgba(228,176,74,.22);
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --beat: .75s;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--night); color: var(--cream); }
body {
  font: 14px/1.5 var(--f-body);
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(1000px 520px at 62% 0%, rgba(255,170,60,.10), transparent 62%), var(--night);
  min-height: 100vh;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--gold-lt); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 11px/1.2 var(--f-mono); letter-spacing: .08em; color: var(--muted); }
.slip { background: linear-gradient(180deg, #21160D, var(--night-2)); border: 1.5px solid var(--line); border-radius: 13px; }

/* the stage */
.stage { position: relative; border-radius: 16px; border: 1.5px solid rgba(228,176,74,.35); overflow: hidden;
  background: radial-gradient(700px 300px at 70% 40%, rgba(255,170,60,.12), transparent 70%), linear-gradient(180deg, #1A0F09, #0E0805); }
.stage-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding: 14px 18px 4px; }
/* The headline block soaks up the free space beside the header row (1000 : 1), so there the row keeps its natural size. The moment
   the row no longer fits it wraps, is alone on its line, and its flex-grow takes the whole row: the switch follows the content,
   not a fixed width. Nothing sits between the two, so nothing can wrap onto a line of its own and add a second row gap. */
.stage-top > :first-child { flex: 1000 1 auto; }
.tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { font: 500 12px/1 var(--f-mono); padding: 6px 11px; border: 1.5px solid var(--claude); border-radius: 8px; color: var(--claude); }
.tag.gpt { border-color: var(--gpt); color: var(--gpt); }
.tags .sep { width: 1.5px; height: 22px; background: var(--line); margin: 0 4px; }
.headline { margin: 12px 0 4px; font: 400 clamp(26px, 3.4vw, 40px)/1.02 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.headline em { color: var(--lamp); font-style: italic; }
.sub { color: var(--muted); font-size: 15px; max-width: 64ch; margin: 0; }
/* The header row: gauges 50 / 50, ledger in equal thirds. Beside the headline it has its natural size and the gauges stretch to
   the ledger's 1.1.0 height; wrapped under the headline it fills the row. The two blocks share the growth and sit on one row
   while they fit, else each takes a row of its own. */
.right { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; justify-content: flex-end; align-self: flex-start; flex: 1 1 auto; min-width: 0; }
.meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: stretch; flex: 1 1 auto; min-width: 0; }
.meter { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 12px; background: rgba(20,13,8,.6); }
.meter svg { flex: 0 1 104px; min-width: 0; width: 104px; height: auto; aspect-ratio: 132 / 76; display: block; }
.txt { display: grid; gap: 2px; justify-items: start; flex: none; }
.meter .who { font: 500 12px/1.2 var(--f-mono); }
/* two readings of equal weight, each led by a swatch that matches its needle: solid = 5 h, faint = week */
.rd { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rd b { font: 400 20px/1.05 var(--f-display); }
.rd small { font: 11px var(--f-mono); color: var(--muted); }
.rd .sw { align-self: center; width: 11px; height: 2px; border-radius: 1px; background: var(--c); }
.rd.wkr .sw { height: 2.4px; opacity: .5; }
.rd.na { white-space: normal; max-width: 96px; }   /* the hint for an unreadable account wraps instead of widening the gauge */
.ledger { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; background: rgba(20,13,8,.6); flex: 1 1 auto; min-width: 0; }
.ledger > div { padding: 8px 14px; display: grid; gap: 4px; border-left: 1.5px solid var(--line); min-width: 0; }
.ledger > div:first-child { border-left: 0; }
.ledger .v { font: 400 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.ledger .v small { font: 500 12px var(--f-mono); color: var(--muted); margin-left: 3px; }
.ledger svg { width: 0; min-width: 100%; height: 18px; display: block; }   /* fills its cell without sizing it: equal thirds stay the 1.1.0 width */
/* page 900px and under: the gauges are alone on a row (with the bigger dial the row would need more than the page gives), so
   the dial may grow. Round number with room to spare: a 1.5px border snaps to 1px at 1x density, which moves an exact edge by a pixel. */
@media (max-width: 900px) {
  .meter { gap: 14px; }
  .meter svg { flex-basis: 124px; width: 124px; }
}
/* page 520px and under */
@media (max-width: 520px) {
  .meter { gap: 6px; padding: 8px; }
  .meter svg { flex-basis: 104px; width: 104px; }
  .meter .who { font-size: 11.5px; }
  .rd b { font-size: 18px; }
  .ledger > div { padding: 8px 10px; }
  .ledger .v { font-size: 22px; }
  .ledger .v small { font-size: 11px; }
  .ledger .label, .ledger .mix { font-size: 10px; }
}
/* page 410px and under: side by side the dial would fall under ~56px, so each half-width card stacks the dial above its
   readings; the dial takes the card's width, up to 124px. Still two gauges across, 50 / 50. */
@media (max-width: 410px) {
  .meter { flex-direction: column; gap: 4px; }
  .meter svg { flex: none; width: 100%; max-width: 124px; }
}
/* page 380px and under: at 320px each ledger third is about 83px wide, too little for 22px figures between 10px paddings ("$12,345.67"
   is 74px). Tighter cells and 18px figures instead; still three across, and a caption that does not fit wraps (at its hyphen). */
@media (max-width: 380px) {
  .ledger > div { padding: 8px 6px; }
  .ledger .v { font-size: 18px; }
  .ledger .v small { font-size: 10px; }
}
.portrait .play { transform-box: fill-box; transform-origin: 50% 100%; animation: play 2.4s ease-in-out infinite; }
.patina { filter: hue-rotate(118deg) saturate(.55) brightness(1.02); }
@keyframes play { 0%, 100% { transform: rotate(-2.2deg) translateY(0); } 25% { transform: rotate(0deg) translateY(-1.5px); } 50% { transform: rotate(2.2deg) translateY(0); } 75% { transform: rotate(0deg) translateY(-1.5px); } }
@keyframes flicker { 50% { opacity: .5; } }

/* The toggle row: its own line under the header row, in the flow (nothing is positioned over the gauges). It stays when the
   hall is hidden, and its bottom padding then closes the frame the way the header's top padding opens it. */
.stage-bar { display: flex; justify-content: flex-end; padding: 2px 18px 10px; }
/* The hall: holds the row of stages. Each live run is its own small stage (.ens); the hall adds no band or line of its own,
   so the stage's gradient runs straight on into the row. Hidden with [hidden]: nothing inside it animates, and the script has
   already taken the stages out. */
.hall { position: relative; padding: 0 2px 8px; overflow: hidden; }
/* The row: stages share ONE row, 3 px apart. They grow to 486 px, never shrink below 236 px; past that the row scrolls. */
.hall > .row { display: flex; gap: 3px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px 0 8px; scrollbar-width: thin; scrollbar-color: rgba(228,176,74,.35) transparent; }
.row > .ens:first-child { margin-left: auto; }           /* centred when it fits, scrollable from the left edge when not */
.row > .ens:last-child { margin-right: auto; }

/* ---- one stage per run: gilt frame, valance + title plate (the arch), opening with slim drapes, floor apron ----
   Width cost of all the chrome: 2 x (2 px frame + 7 px drape) = 18 px. Everything else is full width for the pit. */
.ens { --dw: 7px; --open-d: 0s; flex: 1 1 0; min-width: 236px; max-width: 486px; scroll-snap-align: center; position: relative; display: flex; flex-direction: column;
  border: 1.5px solid var(--line); border-radius: 13px; overflow: hidden; background: linear-gradient(180deg, #21160D, var(--night-2));
  box-shadow: 0 8px 20px rgba(0,0,0,.35); animation: stageIn .6s ease-out; }
@keyframes stageIn { from { opacity: 0; transform: translateY(8px); } }
.ens.leaving { opacity: 0; transform: translateY(10px) scale(.97); transition: opacity .55s ease-in, transform .55s ease-in; pointer-events: none; }
.ens .arch { position: relative; z-index: 5; padding: 13px var(--dw) 6px; background: transparent; border-bottom: 1.5px solid var(--line); }
/* top valance: red swag, scalloped lower edge, sways a little */
.ens .val { position: absolute; left: 0; right: 0; top: 0; height: 15px; z-index: 2; pointer-events: none; transform-origin: 50% 0;
  background: repeating-linear-gradient(90deg, #1E0A07 0, #7A2B1E 8px, #1E0A07 16px);
  -webkit-mask: radial-gradient(12px 14px at 11px 0, #000 97%, transparent 100%) 0 0 / 22px 15px repeat-x;
          mask: radial-gradient(12px 14px at 11px 0, #000 97%, transparent 100%) 0 0 / 22px 15px repeat-x;
  animation: valance 6.5s ease-in-out infinite alternate; animation-delay: var(--sway-d, 0s); }
@keyframes valance { from { transform: scaleY(1); } to { transform: scaleY(1.09); } }
.ens .plate { position: relative; z-index: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0 8px; padding: 6px 10px 7px; border: 1.5px solid var(--line); border-radius: 10px;
  background: linear-gradient(180deg, #21160D, var(--night-2)); cursor: pointer; min-width: 0; }
.ens .plate:hover { border-color: rgba(228,176,74,.6); }
.ens .plate .lamp { grid-row: span 2; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 8px var(--lamp); animation: flicker 2.4s ease-in-out infinite; }
.ens.dim .plate .lamp { background: var(--muted); box-shadow: none; animation: none; opacity: .6; }
.ens .plate h3 { grid-column: 2; margin: 0; font: 400 19px/1.15 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ens .plate .meta { grid-column: 2; margin: 0; font: 11px/1.3 var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ens .plate .meta b { color: var(--gold-lt); font-weight: 500; }
.ens .plate .over { grid-column: 3; grid-row: span 2; font: 600 12px/1 var(--f-mono); color: var(--night); background: var(--gold); border-radius: 999px; padding: 4px 8px; cursor: help; }
/* the opening: pit between two slim drapes. z: drapes 2, role pills 3, opening curtains 4 */
.ens .proc { position: relative; isolation: isolate; padding: 0 var(--dw); background: #0D0805; }
.pit { position: relative; overflow: hidden; background: linear-gradient(180deg, #0D0805, #1A0F08); }
.ens:not(.dim) .pit { background: radial-gradient(80% 70% at 50% 72%, rgba(255,181,71,.11), transparent 70%), linear-gradient(180deg, #0D0805, #1A0F08); }
.pit svg { display: block; width: 100%; height: auto; aspect-ratio: 360 / 250; overflow: hidden; }
.pit .roles { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.pit .role { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 500 10.5px/1 var(--f-mono); letter-spacing: .02em;
  color: var(--gold-lt); background: rgba(20,13,8,.78); border: 1px solid rgba(228,176,74,.35); border-radius: 7px; padding: 2px 6px 3px; transition: opacity .4s; }
.pit .role.gpt { color: #BFE3D8; border-color: rgba(116,185,167,.45); }
/* side drapes: 28 px wide element, clipped to a tied-back shape: wide gathered top (over the empty top corners of the pit),
   7 px strip below the tie. They sway from the top. */
.ens .dr { position: absolute; top: 0; bottom: 0; width: 28px; z-index: 2; pointer-events: none; transform-origin: 50% 0;
  background: linear-gradient(90deg, rgba(0,0,0,.4), transparent 35%, rgba(0,0,0,.35)), repeating-linear-gradient(90deg, #2A0C08 0, #84291C 5px, #2A0C08 11px);
  animation-duration: 7s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; animation-delay: var(--sway-d, 0s); }
.ens .dr.l { left: 0; clip-path: polygon(0 0, 100% 0, 99% 7%, 90% 15%, 66% 23%, 34% 29%, 25% 36%, 25% 100%, 0 100%); animation-name: swayL; }
.ens .dr.r { right: 0; clip-path: polygon(100% 0, 0 0, 1% 7%, 10% 15%, 34% 23%, 66% 29%, 75% 36%, 75% 100%, 100% 100%); animation-name: swayR; }
.ens .dr::after { content: ""; position: absolute; top: 33%; width: 7px; height: 4px; background: linear-gradient(180deg, #F3D58F, #8A6224); border-radius: 1px; }
.ens .dr.l::after { left: 0; } .ens .dr.r::after { right: 0; }
@keyframes swayL { from { transform: skewX(-.9deg); } to { transform: skewX(.9deg); } }
@keyframes swayR { from { transform: skewX(.9deg); } to { transform: skewX(-.9deg); } }
/* opening curtains: two panels over the pit. closed -> open on first appearance, partly drawn when idle, closed again before the stage leaves */
.ens .cur { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 4; pointer-events: none; visibility: hidden;
  background: repeating-linear-gradient(90deg, #1A0907 0, #5A2118 24px, #1A0907 48px);
  transition: transform 2s cubic-bezier(.6,.05,.25,1) var(--open-d), visibility 0s linear calc(2.1s + var(--open-d)); }
.ens .cur.l { left: 0; transform: translateX(-101%); border-right: 2px solid rgba(201,153,60,.7); }
.ens .cur.r { right: 0; transform: translateX(101%); border-left: 2px solid rgba(201,153,60,.7); }
.ens.idle .cur { visibility: visible; transition: transform 1.6s ease-in-out; }
.ens.idle .cur.l { transform: translateX(-82%); } .ens.idle .cur.r { transform: translateX(82%); }
.ens.closing .cur { visibility: visible; transition: transform 1.6s ease-in-out; }
.ens.closing .cur.l, .ens.closing .cur.r, .ens.closed .cur.l, .ens.closed .cur.r { transform: none; }
.ens.closed .cur { visibility: visible; transition: none; }
/* floor apron with its own footlights */
.ens .apron { position: relative; z-index: 5; height: 26px; background: rgba(20,13,8,.6); border-top: 1.5px solid var(--line); }
.ens .apron::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 6px; height: 8px; pointer-events: none;
  background: radial-gradient(6px 3px at 50% 50%, #FFE2A0, rgba(255,210,122,.35) 60%, transparent 100%) 0 0 / 36px 8px repeat-x;
  animation: flicker calc(var(--beat) * 6) ease-in-out infinite; }
.ens.dim .apron::after { opacity: .3; animation: none; }
.ens.dim .val, .ens.dim .dr { filter: brightness(.78) saturate(.85); }
/* the placeholder stage: curtains drawn, nobody home */
.ens.ghost .cur { visibility: visible; transition: none; }
.ens.ghost .cur.l, .ens.ghost .cur.r { transform: none; }
.ens.ghost .plate { cursor: default; }

/* ---- stage motion: one tempo for the hall ---- */
.pit .mot { transform-box: fill-box; transform-origin: 50% 100%; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.m-bow   { animation-name: bow;   animation-duration: calc(var(--beat) * 2); }
.m-cello { animation-name: cello; animation-duration: calc(var(--beat) * 4); }
.m-bass  { animation-name: bass;  animation-duration: calc(var(--beat) * 4); }
.m-wind  { animation-name: wind;  animation-duration: calc(var(--beat) * 2); }
.m-brass { animation-name: brass; animation-duration: calc(var(--beat) * 4); }
.m-perc  { animation-name: perc;  animation-duration: var(--beat); animation-timing-function: cubic-bezier(.2,.8,.3,1) !important; }
@keyframes bow   { 0%, 100% { transform: rotate(-2.6deg); } 50% { transform: rotate(2.6deg) translateY(-3px); } }
@keyframes cello { 0%, 100% { transform: rotate(-2.2deg) translateX(-2px); } 50% { transform: rotate(2.2deg) translateX(2px); } }
@keyframes bass  { 0%, 100% { transform: rotate(-1.8deg); } 10% { transform: rotate(-1.2deg) translateY(3px); } 50% { transform: rotate(1.8deg); } 60% { transform: rotate(1.2deg) translateY(2px); } }
@keyframes wind  { 0%, 100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-5px) rotate(-1.4deg) scale(1.015); } }
@keyframes brass { 0% { transform: rotate(0); } 8% { transform: rotate(-5deg) translateY(-6px); } 40% { transform: rotate(-4deg) translateY(-4px); } 55%, 100% { transform: rotate(0) translateY(0); } }
@keyframes perc  { 0% { transform: translateY(0); } 9% { transform: translateY(6px) rotate(1.4deg); } 35%, 100% { transform: translateY(0); } }
.pit .walk { transform-box: fill-box; transform-origin: 50% 100%; }
.pit .seat { cursor: pointer; }
.pit .seat:hover .halo, .pit .seat:focus .halo { opacity: .6; }
.pit .halo { transition: opacity .4s; }
.pit .note { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: rise calc(var(--beat) * 8) ease-out infinite; }
@keyframes rise { 0% { opacity: 0; transform: translate(0, 0) scale(.6) rotate(-8deg); } 6% { opacity: .95; transform: translate(0, -4px) scale(1) rotate(-4deg); } 45% { opacity: .5; } 60%, 100% { opacity: 0; transform: translate(var(--dx), -54px) scale(1.05) rotate(12deg); } }
.pit .pool { opacity: 0; transition: opacity 1.2s ease; }
.pit .pool.on { opacity: 1; animation: breathe calc(var(--beat) * 8) ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
.pit .house { transition: opacity 1.2s ease; pointer-events: none; }

/* ---- the chief ----
   .chief.conduct  run working, >= 1 seated player: 4/4 baton pattern (back view)
   .chief.study    run thinking, nobody playing: reads a held score, turns a page every 2 bars, practises small beats
   .chief.rest     run idle: arms down, still (the only static state besides the held front pose at done)
   .chief.done     front view: bows once, then stands facing the house
   Face turns (front view, then back): see FACE in the script. */
.chief .turn { transform-origin: 0 0; }
.chief .c-arm-r { transform-origin: 24px -122px; }
.chief .c-fore-r { transform-origin: 50px -134px; }
.chief .c-arm-l { transform-origin: -24px -122px; }
.chief .c-head { transform-origin: 0 -136px; }
.chief .c-body { transform-box: fill-box; transform-origin: 50% 100%; }
.chief .c-score { opacity: 0; transition: opacity .6s; }
.chief .c-page { transform-origin: -62px -160px; }
.chief.conduct .c-arm-r { animation: armR calc(var(--beat) * 4) ease-in-out infinite; }
.chief.conduct .c-fore-r { animation: foreR calc(var(--beat) * 4) ease-in-out infinite; }
.chief.conduct .c-arm-l { animation: armL calc(var(--beat) * 8) ease-in-out infinite; }
.chief.conduct .c-body { animation: dip calc(var(--beat) * 4) ease-in-out infinite; }
/* 1 down, 2 in, 3 out, 4 up: the shoulder carries height, the elbow carries the sideways sweep */
@keyframes armR { 0% { transform: rotate(-18deg); } 20% { transform: rotate(16deg); } 26% { transform: rotate(8deg); } 45% { transform: rotate(10deg); } 51% { transform: rotate(4deg); } 70% { transform: rotate(12deg); } 76% { transform: rotate(4deg); } 96%, 100% { transform: rotate(-18deg); } }
@keyframes foreR { 0% { transform: rotate(0); } 20% { transform: rotate(8deg); } 45% { transform: rotate(-34deg); } 70% { transform: rotate(22deg); } 96%, 100% { transform: rotate(0); } }
@keyframes armL { 0%, 100% { transform: rotate(4deg); } 25% { transform: rotate(-10deg); } 50% { transform: rotate(2deg); } 75% { transform: rotate(-6deg); } }
@keyframes dip { 0%, 16%, 40%, 100% { transform: translateY(0); } 21% { transform: translateY(2px); } }
/* study: score held up in the left hand, head bent to it, page turns on beat 7 of every 8, baton ticks small */
.chief.study .c-score { opacity: 1; }
.chief.study .c-arm-l { transform: rotate(14deg); }
.chief.study .c-page { animation: flip calc(var(--beat) * 8) ease-in-out infinite; }
.chief.study .c-head { animation: read calc(var(--beat) * 8) ease-in-out infinite; }
.chief.study .c-arm-r { animation: pracR calc(var(--beat) * 4) ease-in-out infinite; }
.chief.study .c-fore-r { animation: pracF calc(var(--beat) * 2) ease-in-out infinite; }
.chief.study .c-body { animation: sway calc(var(--beat) * 8) ease-in-out infinite; }
@keyframes flip { 0%, 66% { transform: scaleX(1); } 76% { transform: scaleX(.08) translateY(-3px); } 86%, 100% { transform: scaleX(-1); } }
@keyframes read { 0%, 100% { transform: rotate(-7deg) translateY(1px); } 70% { transform: rotate(-4deg); } 80% { transform: rotate(-9deg) translateY(1.5px); } }
@keyframes pracR { 0%, 100% { transform: rotate(46deg); } 50% { transform: rotate(38deg); } }
@keyframes pracF { 0%, 100% { transform: rotate(18deg); } 30% { transform: rotate(4deg); } 55% { transform: rotate(14deg); } }
@keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1.5px) translateY(-1px); } }
.chief.rest .c-arm-r { transform: rotate(78deg); }
.chief.rest .c-fore-r { transform: rotate(40deg); }
.chief.rest .c-arm-l { transform: rotate(-112deg); }

/* front view (r-chief-legs + r-chief-torso + jointed arms drawn by the script) */
.c-front .f-torso { transform-origin: 0 -62px; }

const POLL_MS = 3000

  { x: 36, y: 146, t: 1 }, { x: 80, y: 200, t: 0 }, { x: 94, y: 127, t: 1 }, { x: 128, y: 184, t: 0 }, { x: 152, y: 120, t: 1 },

/* ---------- small drawings ---------- */
function noteHead(x, y, status, r = 4.2) {
  const [color, kind] = NOTE[status] || NOTE.queued

  /* ---------- render one ensemble ---------- */

  /* ---------- lifecycle: appear, idle, bow, close, leave, reflow ---------- */

/* ---------- the stage header ---------- */
/* The headline and sub count the ensembles on stage, and a run leaves the stage by the clock, so stageTick refreshes them
   on every poll, changed board or not. Writes only on change. */
function renderHeadline(list) {
  const runs = active.runs.filter((r) => !filter || r.repo === filter)
  const ensembles = list.filter((e) => !isGone(e))
  const all = ensembles.flatMap((e) => e.agents.filter((a) => a.status === 'running'))
  const waiting = runs.flatMap(stuck).length
  const headline = all.length
    ? `${ensembles.length} ensemble${ensembles.length === 1 ? '' : 's'}, <em>${all.length} player${all.length === 1 ? '' : 's'}</em> on stage.`
    : ensembles.length ? `${ensembles.length} chief${ensembles.length === 1 ? '' : 's'} at the podium.` : 'The stage is quiet.'
  const onClaude = all.filter((a) => a.provider === 'claude').length, onGpt = all.length - onClaude
  const sub = all.length
    ? `${onClaude} on Claude, ${onGpt} on ChatGPT${waiting ? `, ${waiting} waiting for you` : ''}.`
    : ensembles.length ? `No agent is playing right now${waiting ? `; ${waiting} waiting for you` : ''}.` : 'The next chief run lights the stage.'
  if ($('headline').innerHTML !== headline) $('headline').innerHTML = headline
  if ($('sub').textContent !== sub) $('sub').textContent = sub
}
function renderStage() {
  if (!active) return
  const repos = new Set(active.runs.map((r) => r.repo)).size
  $('where').textContent = `${repos} checkout${repos === 1 ? '' : 's'} · ${active.runs.length} run${active.runs.length === 1 ? '' : 's'}`
  const spend = active.spend || { all_runs: 0, last_24h: 0, burn_per_hour: 0, buckets: [0, 0] }
  $('ledger').innerHTML = `<div><span class="label">all runs</span><span class="v">${money(spend.all_runs)}</span><span class="mix">API-equivalent</span></div>
    <div><span class="label">last 24 h</span><span class="v">${money(spend.last_24h)}</span>${sparkline(spend.buckets)}</div>
    <div><span class="label">burn rate</span><span class="v">${money(spend.burn_per_hour)}<small>/ h</small></span><span class="mix">last 60 min</span></div>`
  const accounts = active.accounts || {}
  $('meters').innerHTML = meter('Claude', accounts.claude, '#D4703C') + meter('ChatGPT', accounts.chatgpt, '#74B9A7')

}
/* Moves the stages on: called once per poll (from renderStage when the board changed, from poll when it did not), so
   idle, leaving after IDLE_LEAVE and coming back happen on an unchanged board too. Adds no timer. While the stage is collapsed
   only the headline follows the board: the stage is neither mounted nor drawn. */
function stageTick(nowMs = Date.now()) {
  const list = stageList(nowMs)
  if (!stageCollapsed) {
    if (!Stage.mounted() && typeof ResizeObserver === 'function') Stage.mount($('stage-row'), { curtains: true })
    Stage.render(list)
  }
  if (active) renderHeadline(list)
}

/* ---------- hide / show the stage ---------- */
/* The choice lives in this browser under one key. Storage can be missing, full or refused: every access is guarded, and the
   page then simply starts open. Collapsing stops the stage (Stage.stop); expanding draws it again from the current board. */
const STAGE_KEY = 'chief.stage.collapsed'
let stageCollapsed = false
const stageSaved = () => { try { return localStorage.getItem(STAGE_KEY) === '1' } catch { return false } }
const stageSave = (on) => { try { localStorage.setItem(STAGE_KEY, on ? '1' : '0') } catch {} }

  stageCollapsed = collapsed

  $('stage-toggle').setAttribute('aria-expanded', String(!collapsed))
  $('stage-toggle').textContent = collapsed ? 'show stage' : 'hide stage'
  if (save) stageSave(collapsed)
  if (collapsed) Stage.stop()

}

}

function roleMix(r) {

const SESSION_COLORS = ['#E4B04A', '#74B9A7', '#D4703C', '#F3D58F', '#9FD4C5', '#B3A285']

  if (arch) { const key = openKey; closeScore(); await archive([key], arch.dataset.archive === 'restore'); return }
  if (t.closest('#archived-toggle')) { view = view === 'archived' ? 'active' : 'archived'; filter = null; await poll(); renderAll(); return }
  if (t.closest('#close')) return closeScore()
  const file = t.closest('[data-file]')
  if (file) { openFile = openFile === file.dataset.file ? null : file.dataset.file; openTranscript = null; renderScore({ force: true }); return }
  const transcript = t.closest('[data-transcript]')
  if (transcript) { openTranscript = openTranscript === transcript.dataset.transcript ? null : transcript.dataset.transcript; openFile = null; renderScore({ force: true }); return }
  const copy = t.closest('[data-copy]')
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = 'copied'; setTimeout(() => { copy.textContent = 'copy resume command' }, 2000) }
    catch { const code = copy.parentElement && copy.parentElement.querySelector('code'); if (code) window.getSelection().selectAllChildren(code) }
    return
  }
  const agent = t.closest('[data-agent]')
  if (agent) { openAgent = agent.dataset.agent; openTranscript = null; renderScore({ force: true }); return }
  if (t.closest('[data-dismiss-missing]')) {
    $('missing').innerHTML = ''
    const p = new URLSearchParams(location.search)
    p.delete('run')
    history.replaceState(null, '', p.toString() ? '?' + p : location.pathname)
    return
  }
  const run = t.closest('[data-run]')
  if (run) { if (t.closest('#missing')) $('missing').innerHTML = ''; return openScore(run.dataset.run) }
  const repo = t.closest('[data-repo]')
  if (repo) {
    filter = repo.dataset.repo || null
    const p = new URLSearchParams(location.search)
    if (filter) p.set('repo', filter); else p.delete('repo')
    history.replaceState(null, '', p.toString() ? '?' + p : location.pathname)
    renderAll()
  }
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeScore()
  if (e.key === 'Enter' && e.target.matches('[data-agent], [data-run][tabindex]')) e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }))
})
$('curtain').addEventListener('click', closeScore)

/* What the user is doing in the score, so a poll never rebuilds it under their hands. */
const touch = () => { lastInteract = Date.now() }
$('score').addEventListener('pointerdown', () => { pointerDown = true; pointerDownAt = Date.now(); touch() })
$('score').addEventListener('wheel', touch)
$('score').addEventListener('scroll', touch, { capture: true })
$('score').addEventListener('touchmove', touch)
$('score').addEventListener('keydown', touch)
document.addEventListener('pointerup', () => { pointerDown = false })
document.addEventListener('pointercancel', () => { pointerDown = false })
document.addEventListener('mouseup', () => { pointerDown = false })
window.addEventListener('blur', () => { pointerDown = false })

/* The board without its timestamp: `generated` differs on every poll, so it must not count as a change. */
function boardSig(text) {
  const b = JSON.parse(text)
  delete b.generated
  return JSON.stringify(b)
}
const fetchBoard = (url) => fetch(url, { cache: 'no-store', headers: DASH_HEADERS })
const STALE_PAGE = 'This page is out of date — reload it.'

/* A ?run= link resolves like the server's find_run: the key, else a bare id that exactly one run has. */
function resolveLinked(linked, runs) {
  const byKey = runs.find((r) => r.key === linked)
  if (byKey) return { run: byKey }
  const byId = runs.filter((r) => r.id === linked)
  if (byId.length === 1) return { run: byId[0] }
  return byId.length > 1 ? { ambiguous: byId } : { missing: true }
}
/* Opens the linked run, or says in #missing why it cannot. Writes nothing else. */
async function openLinked(linked) {
  let found = resolveLinked(linked, active.runs)
  if (found.missing) {
    const res = await fetchBoard('/board.json?view=archived')
    if (res.status === 403) { $('status').textContent = STALE_PAGE; return }
    const text = await res.text()
    const sig = boardSig(text), data = JSON.parse(text)
    lastArchived = sig; archived = data
    found = resolveLinked(linked, archived.runs)
  }
  if (found.run) { $('missing').innerHTML = ''; openScore(found.run.key); return }
  if (found.ambiguous) {
    $('missing').innerHTML = `<div class="notice"><b>which run?</b><span>“${esc(linked)}” is in ${found.ambiguous.length} checkouts:</span> ${found.ambiguous.map((r) => `<button class="chip" type="button" data-run="${esc(r.key)}">${esc(repoName(r.repo))}</button>`).join(' ')}</div>`
    return
  }
  const n = Array.isArray(active.repos) ? active.repos.length : null
  const shows = n == null ? 'It shows the runs of the checkouts on this machine' : `It shows the runs of ${n} ${n === 1 ? 'checkout' : 'checkouts'} on this machine`
  $('missing').innerHTML = `<div class="notice"><b>run not found</b><span>No run “${esc(linked)}” is registered with this dashboard. ${shows}; a run from a removed worktree or another machine is not here.</span><button class="chip" type="button" data-dismiss-missing>dismiss</button></div>`
}

function renderAll() { renderStage(); renderBar(); renderProgramme(); if (openKey) renderScore() }
async function poll() {
  try {
    const res = await fetchBoard('/board.json')
    if (res.status === 403) { $('status').textContent = STALE_PAGE; return }
    const text = await res.text()
    const sig = boardSig(text), data = JSON.parse(text)
    let changed = sig !== lastActive
    if (changed) { lastActive = sig; active = data }
    else { active.generated = data.generated; if (pendingScore) active = data }
    if (view === 'archived') {
      const res2 = await fetchBoard('/board.json?view=archived')
      if (res2.status === 403) { $('status').textContent = STALE_PAGE; return }
      const text2 = await res2.text()
      const sig2 = boardSig(text2), data2 = JSON.parse(text2)
      if (sig2 !== lastArchived) { lastArchived = sig2; archived = data2; changed = true }
      else { archived.generated = data2.generated; if (pendingScore) archived = data2 }
    }
    renderStatus()
    tickCache()  // before the early return below, so an unchanged board still gets fresh minutes
    if (!changed) stageTick()  // a changed board gets its tick from renderStage below
    const linked = params.get('run'), linkPending = linked && !linkedOnce
    if (!changed && !pendingScore && !linkPending) { if (openKey && !openFile && !openTranscript) renderScore(); return }
    if (changed) { renderStage(); renderBar(); renderProgramme() }
    if (linkPending) {
      await openLinked(linked)
      linkedOnce = true  /* only after it completed: a failed archive fetch throws past this and is retried next poll */
    } else if (openKey && !openFile && !openTranscript) renderScore()
  } catch {
    $('status').textContent = 'The dashboard server is not answering. The next chief run starts it again, or run: python3 <chief skill>/scripts/chief-run.py dashboard'
  }
}
$('stage-toggle').addEventListener('click', () => setStage(!stageCollapsed))
setStage(stageSaved(), false)
poll()
setInterval(poll, POLL_MS)
</script>
</body>
